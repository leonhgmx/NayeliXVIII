<!-- Las clases de paleta/fuente/fondo activas redefinen las variables de los tokens (styles.css) -->
<div [class]="clasesTema()" class="min-h-svh text-tinta">
  <p-toast position="top-center" />
  <app-intro-gate />
  <app-butterfly-flock />
  <app-flower-frame />
  <app-audio-player />

  <app-hero />

  <main id="contenido" class="mx-auto flex max-w-md flex-col items-center px-6 pb-20">
    <div
      class="grid w-full grid-cols-2 gap-x-4 gap-y-8 rounded-3xl border border-white/60 bg-white/50 p-6 shadow-xl shadow-neutro/50 backdrop-blur-md sm:gap-x-6 sm:p-8"
    >
      <app-locations />
      <app-rsvp />
      <app-dress-code />
      <app-gifts />
    </div>
  </main>

  <footer class="pb-24 text-center">
    <p class="font-script text-7xl text-acento">¡No faltes!</p>
    <p class="mt-3 text-sm font-light tracking-widest text-tinta-suave uppercase">
      {{ config.nombreFestejada }} · Mis XVIII Años
    </p>
  </footer>
</div>
